# Mimics Supabase's API gateway: routes /auth/v1 and /rest/v1 and, like the
# hosted gateway, answers CORS for browsers (GoTrue alone doesn't).
map $http_origin $cors_origin {
  default $http_origin;
  ""      "*";
}

server {
  listen 8000;
  client_max_body_size 1m;

  set $cors_headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, accept-profile, content-profile, prefer, range";

  location /auth/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers $cors_headers always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://auth:9999/;
  }

  location /rest/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers $cors_headers always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Expose-Headers "content-range" always;
    add_header Vary Origin always;
    proxy_set_header Host $host;
    proxy_pass http://rest:3000/;
  }
}
